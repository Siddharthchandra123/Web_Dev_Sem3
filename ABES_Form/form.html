<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <img src="logo.png" alt="Logo">
        </div>
        <ul class="nav-links">
            <li><a href="#">Home </a></li>
            <li><a href="#">About </a></li>
            <li><a href="#">Contact </a></li>
            <li><a href="#">Services </a></li>
        </ul>
    </div>
    <div class="form" id="userForm">
    <h1 class="heading"><u> ABES 2nd year:A</u></h1>
    <form>
        <label for="Firstname">F.Name:</label>
        <input type="text" id="Firstname" required>
        <br>
        <label for="Lastname">L.Name:</label>
        <input type="text" id="Lastname" required>
        <br>
        <label for="Email">Email:</label>
        <input type="email" id="Email"  required>
        <br>
        <label for="Password">Password:</label>
        <input type="password" id="Password" required>
        <br>
        <label for="Gender">Gender:</label>
        <input type="checkbox" id="Gender" value="Male">
        <label for="Gender">Male</label>
        <input type="checkbox" id="Gender" value="Female">
        <label for="Gender">Female</label>
        <br>

        <label for="Contact">Contact No:</label>
        <input type="text" id="Contact" required>
        <br>

        <label for="Address">Course:</label>
        <input type="checkbox" id="Address" value="B.Tech">
        <label for="Address">B.Tech</label>
        <input type="checkbox" id="Address" value="M.Tech">
        <label for="Address">M.Tech</label>
        <input type="checkbox" id="Address" value="MCA">
        <label for="Address">MCA</label>
        <br>
        <button type="submit">Submit</button>
    
    
    </form>
    <script>
    const form = document.getElementById("userForm");
    form.addEventListener("submit", function(event) {
        event.preventDefault();
        const fullName = document.getElementById("Firstname").value + " " +
                        document.getElementById("Lastname").value;
        sessionStorage.setItem("fullName", fullName);
        window.location.href = "intropage.html";
    });
    </script>
</body>
</html>
